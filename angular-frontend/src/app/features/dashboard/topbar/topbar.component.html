<div class="topbar">
  <h2 class="topbar-title"></h2>
  <div class="topbar-controls">
    <label class="date-label">Date Range</label>
    <nz-range-picker
      [(ngModel)]="dateRange"
      (ngModelChange)="onDateRangeChange($event)"
      nzFormat="dd/MM/yyyy"
      [nzDisabledDate]="disabledFutureDate"
    />
  </div>
</div>
