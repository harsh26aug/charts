<div class="topbar">
  <div class="topbar-menu">
    <nz-radio-group
      [(ngModel)]="selectedMenu"
      (ngModelChange)="onMenuChange($event)"
    >
      <label nz-radio-button nzValue="Sensex">Sensex</label>
      <label nz-radio-button nzValue="Nifty50">Nifty50</label>
    </nz-radio-group>
  </div>
  <div class="topbar-controls">
    <button
      nz-button
      nzType="default"
      class="download-btn"
      (click)="onDownloadPdf()"
      title="Download Nifty table as PDF"
      aria-label="Download Nifty table as PDF"
    >
      <nz-icon nzType="download" />
    </button>

    <nz-range-picker
      [(ngModel)]="dateRange"
      (ngModelChange)="onDateRangeChange($event)"
      nzFormat="dd/MM/yyyy"
      [nzDisabledDate]="disabledFutureDate"
    />
  </div>
</div>
