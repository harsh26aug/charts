<div class="nifty-charts-card">
  <div class="nifty-charts-grid">
    @for (chart of charts; track $index) {
      <div class="chart-slot">
        <div class="chart-slot-header">
          <button nz-button nzType="text" nzSize="small" (click)="changeYear(chart, -1)" class="month-nav-btn">
            <span nz-icon nzType="double-left"></span>
          </button>
          <button nz-button nzType="text" nzSize="small" (click)="changeMonth(chart, -1)" class="month-nav-btn">
            <span nz-icon nzType="left"></span>
          </button>
          <nz-date-picker
            nzMode="month"
            [ngModel]="chart.month()"
            (ngModelChange)="onMonthChange(chart, $event)"
            [nzDisabledDate]="disabledFutureDate"
            nzAllowClear="false"
            class="month-picker"
          />
          <button nz-button nzType="text" nzSize="small" (click)="changeMonth(chart, 1)" [disabled]="isNextMonthDisabled(chart)" class="month-nav-btn">
            <span nz-icon nzType="right"></span>
          </button>
          <button nz-button nzType="text" nzSize="small" (click)="changeYear(chart, 1)" [disabled]="isNextYearDisabled(chart)" class="month-nav-btn">
            <span nz-icon nzType="double-right"></span>
          </button>
        </div>
        <app-calendar-echart
          [data]="chart.data()"
          [month]="chart.month()"
          [isLoading]="chart.isLoading()"
        />
      </div>
    }
  </div>
</div>
