<div class="dashboard-page">
  <app-topbar
    (dateRangeChange)="onDateRangeChange($event)"
    (downloadPdf)="exportNiftyTableAsPdf()"
    (menuChange)="onMenuChange($event)"
  />
  <div class="dashboard-page-content">
    @if (selectedMenu() === 'Sensex') {
      <div class="dashboard-card">
        <nz-tabs
          [nzSelectedIndex]="sensexSelectedIndex()"
          (nzSelectedIndexChange)="sensexSelectedIndex.set($event)"
          nzSize="large"
          class="dashboard-custom-tabs">
          <nz-tab nzTitle="Calendar View">
            @if(sensexSelectedIndex() === 0) {
              <div class="tab-content">
                <app-sensex-charts></app-sensex-charts>
              </div>
            }
          </nz-tab>
          <nz-tab nzTitle="Table View">
            @if(sensexSelectedIndex() === 1) {
              <div class="tab-content">
                <app-sensex
                  [dateRange]="dateRange()">
                </app-sensex>
              </div>
            }
          </nz-tab>
        </nz-tabs>
      </div>
    } @else {
      <div class="dashboard-card">
        <nz-tabs 
          [nzSelectedIndex]="niftySelectedIndex()" 
          (nzSelectedIndexChange)="niftySelectedIndex.set($event)"
          nzSize="large"
          class="dashboard-custom-tabs">
          <nz-tab nzTitle="Calendar View">
            @if(niftySelectedIndex() === 0) {
              <div class="tab-content">
                <app-nifty50-charts></app-nifty50-charts>
                
              </div>
            }
          </nz-tab>
          <nz-tab nzTitle="Table View">
            @if(niftySelectedIndex() === 1) {
              <div class="tab-content">
                <app-nifty50 
                  [dateRange]="dateRange()">
                </app-nifty50>
              </div>
            }
          </nz-tab>
        </nz-tabs>
      </div>
    }
  </div>
</div>
